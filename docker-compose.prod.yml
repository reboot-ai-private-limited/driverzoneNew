# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION — the full stack in Docker.
#
# Builds and runs every server-side artifact the way a deployed host does: the API image, the
# same image again as the worker, and the Next.js admin panel. Use it to verify a release, to
# reproduce a bug that only appears in a built image, or as the basis of an actual deploy.
#
#   cp apps/api/.env.prod.example apps/api/.env.prod   # then edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#
# It is NOT the file to develop against — the apps are baked into images, so every change is a
# rebuild. Use docker-compose.dev.yml for that; see docs/setup-development.md.
#
# Note what is NOT here: apps/customer and apps/driver. Mobile apps do not deploy to a server;
# they build to store binaries via EAS. That is the whole answer to "do I need to ship the
# mobile code to the API server" — no, and there is nowhere for it to go.
#
# On a real host, nginx terminates TLS in front of web:3000 and api:4000 — see
# docs/engineering/build-and-deploy.md.
# ─────────────────────────────────────────────────────────────────────────────

services:
  mongo:
    image: mongo:7
    # A replica set, even with one node. Multi-document transactions require one, and the
    # booking→ledger write in docs/LLD/pricing-and-commission.md needs a transaction to stay consistent.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    # No `ports:` — deliberately. The database is reachable only on the compose network, by
    # api and worker. Publishing 27017 on a production host exposes an unauthenticated Mongo
    # to anything that can route to it. To inspect it, exec in:
    #   docker compose -f docker-compose.prod.yml exec mongo mongosh driverzone
    volumes: ['mongo-data:/data/db']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs once to promote the single node to a replica set, then exits. Without it mongo starts
  # but refuses every write with "not primary".
  mongo-init:
    image: mongo:7
    depends_on:
      mongo: { condition: service_healthy }
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - mongosh --host mongo --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    # Not published, for the same reason as mongo.
    volumes: ['redis-data:/data']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Road distance for outstation band matching (docs/LLD/zone-resolution.md) is served by the
  # Google Routes API, not a container — the pilot VM could not host an OSRM India extract
  # (docs/decision-log.md). Set GOOGLE_ROUTES_API_KEY in apps/api/.env.prod. Self-hosting OSRM
  # again is a matter of adding a service here and setting OSRM_BASE_URL on api + worker.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    # A separate file from apps/api/.env, which holds the localhost URIs the host-run dev API
    # uses. Loading that one here would set NODE_ENV=development inside a production image and
    # point CORS at localhost.
    env_file: [apps/api/.env.prod]
    # Set after env_file, so these win: inside the network the hosts are service names, and no
    # .env.prod should be able to misdirect them.
    environment:
      MONGO_URI: mongodb://mongo:27017/driverzone?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      # WITHOUT THIS, EVERY TRIP OFFER IS A `MockPushSender` NO-OP and nothing reaches a driver's
      # phone in the background. The path is inside the container; the file arrives via the bind
      # mount below. `notifications.container.ts` reads exactly this variable — the LLD's mention
      # of `FCM_SERVICE_ACCOUNT_JSON` is stale, do not use that name.
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/fcm-service-account.json
    # The Firebase Admin key, mounted read-only rather than baked into the image — it is a
    # secret and the Dockerfile deliberately never COPYs it. Place the real key at
    # `apps/api/firebaseServiceAccount.json` on the host before `up`; it must belong to the same
    # Firebase project as `apps/driver/google-services.json` (`driver-zone-cf117`).
    volumes:
      - ./apps/api/firebaseServiceAccount.json:/run/secrets/fcm-service-account.json:ro
    ports: ['4000:4000']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  # Same image as `api`, different command. One build, two processes — see apps/api/Dockerfile.
  # A worker running different code from the API is a whole category of bug that cannot occur
  # while this stays a command override rather than a second build.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [apps/api/.env.prod]
    environment:
      MONGO_URI: mongodb://mongo:27017/driverzone?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      # The worker sends push too — the dispatch wave runs here, and so does the presence sweep's
      # "you've gone offline" notice. Same key, same mount as `api`.
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/fcm-service-account.json
    volumes:
      - ./apps/api/firebaseServiceAccount.json:/run/secrets/fcm-service-account.json:ro
    restart: unless-stopped

  # Seeds the known development accounts and zones into a DEPLOYED stack. One-shot, and behind a
  # profile so `up -d` never touches it:
  #
  #   docker compose -f docker-compose.prod.yml run --rm seed
  #   docker compose -f docker-compose.prod.yml run --rm seed node dist/scripts/seed.js --reset
  #
  # Run it AFTER the stack is up, so mongo-init has promoted the replica set. The script itself
  # refuses to run against NODE_ENV=production unless STAGING_UNSAFE=true is in .env.prod — the
  # accounts it creates have a published login, so this is a staging-only convenience.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['seed']
    # dist/scripts/, not dist/ — esbuild mirrors each entrypoint's path below src/.
    command: ['node', 'dist/scripts/seed.js']
    depends_on:
      mongo: { condition: service_healthy }
    env_file: [apps/api/.env.prod]
    # Same overrides as api and worker: service names win over anything in the env file.
    environment:
      MONGO_URI: mongodb://mongo:27017/driverzone?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* must arrive as BUILD args, not runtime env: `next build` inlines them into
      # the client bundle, so by the time a container starts the strings are already frozen into
      # the JS chunks. Values are interpolated from the repo-root `.env` (compose reads it
      # automatically) — see .env.example. Changing one is a rebuild, not a restart.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    # Runtime env for the standalone server. Nothing NEXT_PUBLIC_* belongs here — it would be read
    # far too late — but this stays the right channel for a genuine server-side variable.
    env_file: [apps/web/.env.prod]
    depends_on:
      api: { condition: service_healthy }
    ports: ['3000:3000']
    restart: unless-stopped

  # The public marketing site (apps/site). No database; its /delete-account form calls the api
  # from the browser, so the site's origin must be in the api's CORS_ORIGINS. nginx fronts it on
  # the main domain like web and api.
  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
      # Build arg for the same reason as web's: `next build` inlines NEXT_PUBLIC_*. From the
      # repo-root `.env` — see .env.example.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports: ['3001:3001']
    restart: unless-stopped

# Named explicitly, and distinctly from the dev file's volumes. Compose's default name is
# derived from the directory, which both files share — so without these a prod-stack run and a
# dev-stack run would read and write the same database.
volumes:
  mongo-data:
    name: driverzone-mongo-data-prod
  redis-data:
    name: driverzone-redis-data-prod
