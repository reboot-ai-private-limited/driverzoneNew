# Local development stack. Production runs the same two images behind nginx — see
# docs/engineering/09-build-and-deploy.md.
#
# Note what is NOT here: apps/customer and apps/driver. Mobile apps do not deploy to a server;
# they build to store binaries via EAS. That is the whole answer to "do I need to ship the
# mobile code to the API server" — no, and there is nowhere for it to go.

services:
  mongo:
    image: mongo:7
    # A replica set, even with one node. Multi-document transactions require one, and the
    # booking→ledger write in docs/05 needs a transaction to stay consistent. Adding it later
    # means re-seeding every environment.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs once to promote the single node to a replica set, then exits. Without it mongo starts
  # but refuses every write with "not primary".
  mongo-init:
    image: mongo:7
    depends_on:
      mongo: { condition: service_healthy }
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - mongosh --host mongo --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Road distance for outstation band matching (docs/04). Self-hosted because every quote hits
  # it and quote volume runs ~3x booking volume — per-call pricing adds up fast.
  #
  # Needs a prepared OSM extract before first run; see docs/engineering/09-build-and-deploy.md.
  # Commented out until then so `docker compose up` works on a fresh clone.
  # osrm:
  #   image: ghcr.io/project-osrm/osrm-backend:latest
  #   command: ['osrm-routed', '--algorithm', 'mld', '/data/india-latest.osrm']
  #   ports: ['5000:5000']
  #   volumes: ['./deploy/osrm:/data']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [apps/api/.env]
    environment:
      MONGO_URI: mongodb://mongo:27017/driverzone?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
    ports: ['4000:4000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  # Same image as `api`, different command. One build, two processes — see apps/api/Dockerfile.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [apps/api/.env]
    environment:
      MONGO_URI: mongodb://mongo:27017/driverzone?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    depends_on: [api]
    ports: ['3000:3000']

volumes:
  mongo-data:
  redis-data:
