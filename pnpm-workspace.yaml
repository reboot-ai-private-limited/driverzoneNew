packages:
  - "apps/*"
  - "packages/*"

# Packages permitted to run install scripts. pnpm blocks them by default — a postinstall
# script is arbitrary code from a transitive dependency — so each entry is an explicit
# decision. These four need to compile or download a native binary to function at all.
allowBuilds:
  # A telemetry ping to scarf.sh, pulled in transitively by swagger-ui-express. Not needed for
  # anything to function — unlike the four below, it compiles nothing and downloads nothing.
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - expo-font@57.0.2

# The setting that makes Metro work, and it MUST live here rather than in `.npmrc`.
#
# This pnpm reads its configuration from this file, and `node-linker=hoisted` in `.npmrc` is
# silently ignored — which leaves the default isolated symlink layout in place and breaks the
# React Native bundler with "Unable to resolve module react-native". The `.npmrc` comment
# explaining WHY hoisting is required is still the one to read; only its location was wrong.
# See docs/engineering/mobile-in-monorepo.md.
nodeLinker: hoisted
